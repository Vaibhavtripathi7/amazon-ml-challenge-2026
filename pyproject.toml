[project]
name = "amlc"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy", "pandas"]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amlc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
