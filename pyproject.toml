[project]
name = "amlc"
version = "0.1.0"
description = "Business entity resolution across three noisy sources (Amazon ML Challenge 2026)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.13"
dependencies = [
    "anyascii>=0.3.3",
    "lightgbm>=4.7.0",
    "numpy",
    "pandas",
    "pyarrow>=25.0.1",
    "rapidfuzz>=3.14.6",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "sparse-dot-topn>=1.2.0",
    "tqdm>=4.70.1",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amlc"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel.force-include]
"src/amlc/resources" = "amlc/resources"
