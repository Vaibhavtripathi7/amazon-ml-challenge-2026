[project]
name = "amlc"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "lightgbm>=4.7.0",
    "numpy",
    "pandas",
    "pillow>=12.3.0",
    "pyarrow>=25.0.1",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "tqdm>=4.70.1",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amlc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
